name: 🧪 PR Build & Test

on:
  pull_request:
    branches: [ main, dev ]

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check Migration File Naming
        run: |
          #!/bin/bash
          
          error_count=0
          migration_dir="src/main/resources/db/migration"
          
          [ -d "$migration_dir" ] || exit 0
          
          for file in "$migration_dir"/*; do
            [ -f "$file" ] || continue
          
            filename=$(basename "$file")
          
            if ! [[ $filename =~ ^V[0-9]{8}_[0-9]{4}__[a-z0-9_]+\.sql$ ]]; then
              echo "❌ 잘못된 파일명: $filename"
              echo "   형식: V{yyyyMMdd_HHmm}__{description}.sql"
              echo "   description은 소문자, 숫자, 언더스코어(_)만 허용"
              ((error_count++))
            fi
          done
          
          if [ $error_count -gt 0 ]; then
            echo ""
            echo "❌ $error_count 개의 파일명 오류 발견"
            exit 1
          fi
          
          echo "✅ 모든 마이그레이션 파일명이 규칙을 따릅니다"

      - name: Check Migration Timestamp Order
        run: |
          #!/bin/bash
          
          migration_dir="src/main/resources/db/migration"
          base_branch="origin/${{ github.base_ref }}"
          
          [ -d "$migration_dir" ] || exit 0
          
          # PR에서 추가된 마이그레이션 파일만 추출
          new_files=$(git diff --name-only --diff-filter=A ${base_branch}...HEAD \
            | grep "^${migration_dir}/V" || true)
          
          [ -z "$new_files" ] && echo "✅ 새로운 마이그레이션 파일 없음" && exit 0
          
          # 타겟 브랜치의 마지막 마이그레이션 타임스탬프 추출
          last_timestamp=$(git ls-tree -r ${base_branch} --name-only \
            | grep "^${migration_dir}/V" \
            | sed 's/.*\/V\([0-9_]*\)__.*/\1/' \
            | sort | tail -1)
          
          if [ -z "$last_timestamp" ]; then
            echo "✅ 타겟 브랜치에 마이그레이션 파일 없음, 체크 생략"
            exit 0
          fi
          
          echo "📌 ${base_branch} 마지막 타임스탬프: $last_timestamp"
          
          error_count=0
          while IFS= read -r file; do
            filename=$(basename "$file")
            timestamp=$(echo "$filename" | sed 's/^V\([0-9_]*\)__.*/\1/')
          
            if [[ "$timestamp" < "$last_timestamp" ]]; then
              echo "❌ 타임스탬프 역전 감지: $filename"
              echo "   PR 파일 타임스탬프: $timestamp"
              echo "   ${base_branch} 마지막 타임스탬프: $last_timestamp"
              ((error_count++))
            fi
          done <<< "$new_files"
          
          if [ $error_count -gt 0 ]; then
            echo ""
            echo "❌ 타임스탬프가 역전된 마이그레이션 파일이 있습니다."
            echo "   파일 생성 시각을 현재 시각으로 변경해주세요."
            exit 1
          fi
          
          echo "✅ 마이그레이션 타임스탬프 순서가 올바릅니다"

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'corretto'
          cache: 'gradle'

      - name: Grant execute permission to Gradle
        run: chmod +x ./gradlew

      - name: Build project
        run: ./gradlew assemble

      - name: Run tests
        env:
          SPRING_PROFILES_ACTIVE: test
        run: ./gradlew test

      - name: Publish test results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action/linux@v2
        with:
          files: '**/build/test-results/test/TEST-*.xml'

      - name: add comments to a pull request
        uses: mikepenz/action-junit-report@v5
        if: always()
        with:
          report_paths: '**/build/test-results/test/TEST-*.xml'
