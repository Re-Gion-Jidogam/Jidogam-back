<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>장소 포인트 수정 - 지도감 관리자</title>
  <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>
  <div class="admin-layout">
    <aside th:replace="~{admin/fragments/layout :: sidebar}" th:with="menu='places'"></aside>

    <div class="main-content">
      <header th:replace="~{admin/fragments/layout :: topbar}"></header>

      <main class="content-area">
        <div class="page-header">
          <h2>장소 포인트 수정</h2>
          <a th:href="@{/jidogam-admin/places/{id}(id=${place.id()})}" class="btn-back">&larr; 상세로</a>
        </div>

        <div class="form-card">
          <form th:action="@{/jidogam-admin/places/{id}/edit(id=${place.id()})}" method="post">
            <div class="form-group">
              <label>장소명</label>
              <input type="text" th:value="${place.name()}" disabled class="form-input">
            </div>
            <div class="form-group">
              <label>주소</label>
              <input type="text" th:value="${place.address()}" disabled class="form-input">
            </div>
            <div class="form-group">
              <label for="exp">포인트 (경험치)</label>
              <input type="number" id="exp" name="exp" th:value="${place.exp()}"
                     min="0" required class="form-input">
            </div>

            <div class="form-actions">
              <button type="submit" class="btn-save">저장</button>
              <a th:href="@{/jidogam-admin/places/{id}(id=${place.id()})}" class="btn-cancel">취소</a>
            </div>
          </form>
        </div>
      </main>
    </div>
  </div>
</body>
</html>
